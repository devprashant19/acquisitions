name: Lint and Format Check

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

jobs:
  lint-and-format:
    name: Lint & Prettier Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        
      - name: Run Prettier Check
        run: npm run format:check

      - name: Annotate formatting issues
        if: failure()
        run: |
          echo "::error title=Lint or Format failed::Please run 'npm run lint:fix' and 'npm run format' locally and commit the changes to fix these issues."
